<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display Images from Array</title>
</head>
<body>
  <h2>Images from Array</h2>
  <div id="image-container"></div>

  <script>
    // Store full <img> tags as strings in an array
    var arr = [
      "<img src='https://picsum.photos/id/1015/300/200' alt='Mountain landscape'>",
      "<img src='https://picsum.photos/id/1016/300/200' alt='Ocean view'>",
      "<img src='https://picsum.photos/id/1018/300/200' alt='Forest path'>"
    ];

    // Get the container element
    var container = document.getElementById("image-container");

    // Iterate through the array and display each image
    for (var i = 0; i < arr.length; i++) {
      container.innerHTML += arr[i];
    }
  </script>
</body>
</html>
