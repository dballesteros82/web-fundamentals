<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add 3 Images with a For Loop</title>
</head>
<body>
  <h1>Three consecutive images added with a for loop</h1>
  <div id="image-container"></div>

  <script>
    const container = document.getElementById("image-container");

    for (let i = 0; i < 3; i++) {
      const img = document.createElement("img");
      img.src = `https://picsum.photos/200/150?random=${i}`;
      img.alt = `Image ${i + 1}`;
      container.appendChild(img);
    }
  </script>
</body>
</html>
